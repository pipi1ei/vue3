<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="btn">toggle flag</button>
    <button id="nameBtn">change name</button>
    <button id="ageBtn">change age</button>
    <p id="text"></p>
    <script type="module">
      import { effect, reactive } from '../dist/reactivity.esm.js'

      const state = reactive({
        a: {
          b: 0,
        },
      })

      effect(() => {
        console.log(state.a.b)
      })

      setTimeout(() => {
        state.a.b++
      }, 1000)
    </script>
  </body>
</html>
